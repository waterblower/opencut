<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="922" viewBox="0 0 1080 922">
<style>.s{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}.m{font-family:"SF Mono",Menlo,Monaco,Consolas,monospace}.f-text{fill:#f2f2f4}.f-muted{fill:#777780}.f-border{fill:#2b2b31}.k-border{stroke:#2b2b31}.f-surface{fill:#17171a}.f-panel{fill:#0d0d0f}.f-hover{fill:#202024}.f-accent{fill:#f0b75e}.k-accent{stroke:#f0b75e}.f-accent-bg{fill:#2a241b}.f-grey-2{fill:#45454d}</style>
<defs>
