<text class="s" x="516" y="833" font-size="14" fill="#f2f2f4" font-weight="400" text-anchor="start">Generate SRT</text>
<text class="s" x="516" y="873" font-size="14" fill="#f2f2f4" font-weight="400" text-anchor="start">Reveal in Finder</text>
<text class="m" x="784" y="873" font-size="14" fill="#777780" font-weight="400" text-anchor="end">⌥⌘R</text>
<text class="s" x="516" y="913" font-size="14" fill="#f2f2f4" font-weight="400" text-anchor="start">Open in Default App</text>
<text class="m" x="784" y="913" font-size="14" fill="#777780" font-weight="400" text-anchor="end">⌃⇧↵</text>
