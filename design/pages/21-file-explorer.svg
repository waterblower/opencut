<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" role="img" aria-labelledby="title description">
  <title id="title">File Explorer</title>
  <desc id="description">File Explorer design proposal: draggable media uses an open-hand cursor, while timeline files, folders, the project root and unsupported files use the standard arrow. Draggable types are video, audio, images and SRT. Both variants keep the same full-row hover highlight. A context menu retains its source-row highlight until dismissal, independently of selection and the active timeline.</desc>
  <style>.s{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}.m{font-family:"SF Mono",Menlo,Monaco,Consolas,monospace}</style>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".35" />
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1090" fill="#151518" />
  <text class="s" x="48" y="61" font-size="24" fill="#f2f2f4" font-weight="700" text-anchor="start">File Explorer</text>
  <text class="s" x="48" y="89" font-size="14" fill="#777780" font-weight="400" text-anchor="start">File hover reflects drag support. Context menus keep their source row visible.</text>
  <text class="s" x="48" y="136" font-size="14" fill="#f2f2f4" font-weight="600" text-anchor="start">Draggable · hover</text>
  <text class="s" x="48" y="157" font-size="12" fill="#777780" font-weight="400" text-anchor="start">Video, audio, images and SRT files use the open hand.</text>
  <text class="s" x="636" y="136" font-size="14" fill="#f2f2f4" font-weight="600" text-anchor="start">Not draggable · hover</text>
  <text class="s" x="636" y="157" font-size="12" fill="#777780" font-weight="400" text-anchor="start">Timeline files, folders and unsupported files use the arrow.</text>
  <rect x="48" y="170" width="556" height="324" fill="#0d0d0f" rx="10" filter="url(#shadow)" />
