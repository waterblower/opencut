  <text class="s" x="516" y="1033" font-size="14" fill="#ff8b8b" font-weight="400" text-anchor="start">Move to Trash</text>
  <path transform="translate(691 869)" d="M0 0V20L5.5 15.5 10 25 14 23 9.5 13.5 17 13Z" fill="#f2f2f4" stroke="#080809" stroke-width="1.5" stroke-linejoin="round" />
  <text class="s" x="636" y="656" font-size="16" fill="#f2f2f4" font-weight="600" text-anchor="start">The menu belongs to broll-street.mov</text>
  <text class="s" x="636" y="686" font-size="13" fill="#a0a0a8" font-weight="400" text-anchor="start">The same hover background stays on that row while</text>
  <text class="s" x="636" y="706" font-size="13" fill="#a0a0a8" font-weight="400" text-anchor="start">the menu is open. Moving through menu items does</text>
  <text class="s" x="636" y="726" font-size="13" fill="#a0a0a8" font-weight="400" text-anchor="start">not transfer the highlight to another file.</text>
  <text class="s" x="848" y="844" font-size="14" fill="#f2f2f4" font-weight="600" text-anchor="start">On dismissal</text>
  <text class="s" x="848" y="870" font-size="12" fill="#777780" font-weight="400" text-anchor="start">Clear the temporary highlight.</text>
  <text class="s" x="848" y="890" font-size="12" fill="#777780" font-weight="400" text-anchor="start">Keep it only if the pointer is still</text>
  <text class="s" x="848" y="910" font-size="12" fill="#777780" font-weight="400" text-anchor="start">over the source row.</text>
  <text class="s" x="848" y="950" font-size="14" fill="#f2f2f4" font-weight="600" text-anchor="start">Selection stays separate</text>
  <text class="s" x="848" y="976" font-size="12" fill="#777780" font-weight="400" text-anchor="start">Opening a menu does not select a file</text>
  <text class="s" x="848" y="996" font-size="12" fill="#777780" font-weight="400" text-anchor="start">or change the active timeline.</text>
