<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" role="img" aria-labelledby="title description">
<title id="title">File Explorer</title>
<desc id="description">File Explorer design proposal: normal browsing, hover, and a context menu whose source file keeps its hover highlight while the pointer is in the menu. Opening a menu does not change the selected file or active timeline. The temporary highlight clears when the menu closes, unless the pointer remains over the row. This treatment also applies to folders and the project root.</desc>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}.m{font-family:"SF Mono",Menlo,Monaco,Consolas,monospace}</style>
<defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter></defs>
<rect x="0" y="0" width="1240" height="1090" fill="#151518" />
<text class="s" x="48" y="61" font-size="24" fill="#f2f2f4" font-weight="700" text-anchor="start">File Explorer</text>
<text class="s" x="48" y="89" font-size="14" fill="#777780" font-weight="400" text-anchor="start">Browse project files. Keep the source of every context menu visible.</text>
<text class="s" x="48" y="136" font-size="14" fill="#f2f2f4" font-weight="600" text-anchor="start">Browsing</text>
<text class="s" x="48" y="157" font-size="12" fill="#777780" font-weight="400" text-anchor="start">File types, filenames and sizes. Amber marks the active timeline.</text>
<text class="s" x="636" y="136" font-size="14" fill="#f2f2f4" font-weight="600" text-anchor="start">File hover</text>
<text class="s" x="636" y="157" font-size="12" fill="#777780" font-weight="400" text-anchor="start">A full-row highlight follows the pointer.</text>
