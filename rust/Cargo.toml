[package]
name = "opencut-player"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
env_logger = "0.11"
gpui = "0.2"
gpui-video-player = { path = "vendor/gpui-video-player" }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
