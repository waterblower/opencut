[workspace]
resolver = "3"
members = [
    "libs/media-backend",
    "libs/timeline",
    "libs/engine",
    "libs/transcribe",
    "libs/player-ui",
    "apps/cli",
    "apps/editor",
    "apps/player",
    "examples",
    "scripts",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
timeline = { path = "libs/timeline" }
engine = { path = "libs/engine" }
transcribe = { path = "libs/transcribe" }
media-backend = { path = "libs/media-backend" }
player-ui = { path = "libs/player-ui" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["multipart", "rustls-tls"] }
clap = { version = "=4.5.49", features = ["derive"] }
schemars = { version = "=1.2.2", features = ["derive"] }
resvg = "=0.45.1"
anyhow = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
cpal = "0.17.1"
env_logger = "0.11"
ffmpeg-next = "8.1"
gpui = { path = "vendor/zed/crates/gpui" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit"] }
gpui_tokio = { path = "vendor/zed/crates/gpui_tokio" }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }
log = "0.4"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-script = "0.5.8"
ulid = { version = "3", features = ["serde"] }
block2 = "0.6"
core-foundation = "0.10"
core-video = "0.5.2"
metal = "0.33"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSEvent",
    "block2",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

[profile.dev.package."*"]
opt-level = 1

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/zed/crates/gpui" }
gpui_macros = { path = "vendor/zed/crates/gpui_macros" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform" }
