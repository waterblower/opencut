[package]
name = "opencut-player"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "opencut-editor"

[[bin]]
name = "opencut-player"
path = "src/player/main.rs"
required-features = ["player"]

[[bin]]
name = "loc"
path = "scripts/count_lines.rs"

[[bin]]
name = "mp3"
path = "src/examples/mp3.rs"
required-features = ["mp3"]

[[bin]]
name = "mp4"
path = "src/examples/mp4.rs"
required-features = ["mp4"]

[[bin]]
name = "mp4-v2"
path = "src/examples/mp4-v2.rs"
required-features = ["mp4"]

[[bin]]
name = "2windows"
path = "src/examples/2windows.rs"
required-features = ["2windows"]

[[bin]]
name = "opencut-editor"
path = "src/editor/.main.rs"
required-features = ["editor"]

[features]
default = ["editor"]
ffmpeg-backend = ["dep:anyhow", "dep:async-channel", "dep:ffmpeg-next", "dep:cpal"]
ffmpeg-video = ["ffmpeg-backend", "dep:gpui", "dep:image", "dep:smallvec", "dep:log", "dep:core-foundation", "dep:core-video"]
ffmpeg-video-tests = ["ffmpeg-video", "gpui/test-support"]
mp3 = ["dep:anyhow", "dep:ffmpeg-next", "dep:cpal"]
mp4 = ["mp3", "ui", "dep:image", "dep:smallvec", "dep:core-foundation", "dep:core-video"]
2windows = ["ui"]
ui = ["dep:gpui", "dep:gpui_platform", "dep:env_logger"]
player = [
    "ffmpeg-video",
    "ui",
    "dep:serde",
    "dep:serde_json",
    # The history thumbnail generator still uses GStreamer, not playback.
    "dep:url",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
]
editor = [
    "gstreamer-backend",
    "gpui/inspector",
    "dep:gpui-component",
    "dep:serde",
    "dep:serde_json",
    "dep:unicode-segmentation",
    "dep:ulid",
    "dep:block2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:ffmpeg-next",
    "dep:gstreamer-editing-services",
    "dep:gstreamer-pbutils",
]
gstreamer-backend = [
    "ui",
    "dep:anyhow",
    "dep:image",
    "dep:log",
    "dep:url",
    "dep:core-foundation",
    "dep:core-video",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-audio",
    "dep:gstreamer-video",
    "dep:parking_lot",
    "dep:smallvec",
    "dep:yuv",
]

[dependencies]
anyhow = { version = "1", optional = true }
async-channel = { version = "2.5", optional = true }
cpal = { version = "0.17.1", optional = true }
env_logger = { version = "0.11", optional = true }
ffmpeg-next = { version = "8.1", optional = true }
gpui = {
  path = "vendor/zed/crates/gpui",
  optional = true,
}
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit"], optional = true }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "7d0aaf55", optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-audio = { version = "0.25", optional = true }
gstreamer-editing-services = { version = "0.25", optional = true, features = ["v1_18"] }
gstreamer-pbutils = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }

log = { version = "0.4", optional = true }
parking_lot = { version = "0.12", optional = true }
smallvec = { version = "1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
url = { version = "2", optional = true }
unicode-segmentation = { version = "1", optional = true }
ulid = { version = "3", optional = true, features = ["serde"] }
yuv = { version = "0.8", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
core-foundation = { version = "0.10", optional = true }
core-video = { version = "0.5.2", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "NSEvent",
    "block2",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

[profile.dev.package."*"]
opt-level = 1

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/zed/crates/gpui" }
gpui_macros = { path = "vendor/zed/crates/gpui_macros" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform" }
