[package]
name = "opencut-player"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "opencut-editor"

[[bin]]
name = "opencut-player"
path = "src/player/main.rs"
required-features = ["gstreamer-backend"]

[[bin]]
name = "loc"
path = "scripts/count_lines.rs"

[[bin]]
name = "2windows"
path = "src/examples/2windows.rs"

[[bin]]
name = "opencut-editor"
path = "src/editor/.main.rs"
required-features = ["editor"]

[features]
default = ["editor"]
editor = [
    "gstreamer-backend",
    "dep:ffmpeg-next",
    "dep:gstreamer-editing-services",
    "dep:gstreamer-pbutils",
]
gstreamer-backend = [
    "dep:core-foundation",
    "dep:core-video",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-audio",
    "dep:gstreamer-video",
    "dep:parking_lot",
    "dep:smallvec",
    "dep:yuv",
]

[dependencies]
futures-util = "0.3"
env_logger = "0.11"
ffmpeg-next = { version = "8.1", optional = true }
gpui = {
  path = "vendor/zed/crates/gpui",
  features = ["inspector"],
}
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit"] }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-audio = { version = "0.25", optional = true }
gstreamer-editing-services = { version = "0.25", optional = true, features = ["v1_18"] }
gstreamer-pbutils = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }
log = "0.4"
parking_lot = { version = "0.12", optional = true }
smallvec = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
unicode-segmentation = "1"
ulid = { version = "3", features = ["serde"] }
yuv = { version = "0.8", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = { version = "0.10", optional = true }
core-video = { version = "0.5.2", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSEvent",
    "block2",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

[profile.dev.package."*"]
opt-level = 1
