[package]
name = "opencut-player"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "opencut-player"

[[bin]]
name = "opencut-player"
path = "src/main-player.rs"
required-features = ["gstreamer-backend"]

[[bin]]
name = "loc"
path = "scripts/count_lines.rs"

[[bin]]
name = "opencut-editor"
path = "src/main-editor.rs"
required-features = ["editor"]

[features]
default = ["gstreamer-backend"]
editor = ["gstreamer-backend", "dep:ffmpeg-next"]
gstreamer-backend = [
    "dep:gpui-video-player",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
    "dep:yuv",
]

[dependencies]
env_logger = "0.11"
ffmpeg-next = { version = "8.1", optional = true }
gpui = { version = "0.2", features = ["inspector"] }
gpui-video-player = { path = "vendor/gpui-video-player", optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
yuv = { version = "0.8", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSEvent",
    "block2",
    "objc2-core-foundation",
] }
