[package]
name = "opencut-player"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "opencut-player"

[[bin]]
name = "opencut-player"
path = "src/main.rs"
required-features = ["gstreamer-backend"]

[[bin]]
name = "loc"
path = "scripts/count_lines.rs"

[[bin]]
name = "opencut-player-ffmpeg"
path = "src/main-ffmpeg.rs"
required-features = ["ffmpeg-backend"]

[features]
default = ["gstreamer-backend"]
ffmpeg-backend = ["dep:ffmpeg-next", "dep:rodio", "dep:smallvec"]
gstreamer-backend = [
    "dep:gpui-video-player",
    "dep:gstreamer",
    "dep:gstreamer-app",
    "dep:gstreamer-video",
    "dep:yuv",
]

[dependencies]
env_logger = "0.11"
ffmpeg-next = { version = "8.1", optional = true }
gpui = "0.2"
gpui-video-player = { path = "vendor/gpui-video-player", optional = true }
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.22.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", optional = true }
url = "2"
yuv = { version = "0.8", optional = true }
