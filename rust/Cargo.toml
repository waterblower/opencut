[package]
name = "opencut-player"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "opencut-editor"

[[bin]]
name = "opencut"
path = "src/cli/main.rs"
required-features = ["cli"]

[[bin]]
name = "opencut-player"
path = "src/player/main.rs"
required-features = ["player"]

[[bin]]
name = "loc"
path = "scripts/count_lines.rs"

[[bin]]
name = "mp3"
path = "src/examples/mp3.rs"
required-features = ["mp3"]

[[bin]]
name = "2windows"
path = "src/examples/2windows.rs"
required-features = ["2windows"]

[[bin]]
name = "opencut-editor"
path = "src/editor/.main.rs"
required-features = ["editor"]

[features]
default = ["editor"]
timeline = ["dep:anyhow", "dep:serde", "dep:serde_json", "dep:serde_path_to_error", "dep:ulid"]
timeline-schema = ["timeline", "dep:schemars"]
cli = ["dep:gpui", "dep:gpui_platform", "gpui_platform/test-support", "timeline-schema", "dep:clap", "dep:ffmpeg-next", "dep:image", "dep:resvg", "dep:tokio", "transcribe"]
transcribe = ["dep:anyhow", "dep:ffmpeg-next", "dep:reqwest", "dep:serde_json", "dep:unicode-script"]
jev = ["dep:tokio", "dep:reqwest", "dep:serde", "dep:serde_json"]
gpl = ["cli"]
ffmpeg-backend = ["dep:anyhow", "dep:async-channel", "dep:ffmpeg-next", "dep:cpal", "dep:core-foundation", "dep:core-video"]
ffmpeg-video = ["ffmpeg-backend", "dep:gpui", "dep:image", "dep:smallvec", "dep:log", "dep:core-foundation", "dep:core-video"]
ffmpeg-video-tests = ["ffmpeg-video", "gpui/test-support"]
mp3 = ["dep:anyhow", "dep:ffmpeg-next", "dep:cpal"]
2windows = ["ui"]
ui = ["dep:gpui", "dep:gpui_platform", "dep:env_logger"]
player = [
    "ui",
    "ffmpeg-video",
    "dep:serde",
    "dep:serde_json",
]
editor = [
    "ffmpeg-video",
    "dep:resvg",
    "dep:tokio",
    "dep:gpui_tokio",
    "timeline",
    "transcribe",
    "ui",
    "gpui/inspector",
    "dep:gpui-component",
    "dep:serde",
    "dep:serde_json",
    "dep:unicode-segmentation",
    "dep:ulid",
    "dep:block2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:ffmpeg-next",
]
[dependencies]
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "fs", "time"] }
reqwest = { version = "=0.12.24", optional = true, default-features = false, features = ["multipart", "rustls-tls"] }
serde_path_to_error = { version = "=0.1.20", optional = true }
clap = { version = "=4.5.49", optional = true, features = ["derive"] }
schemars = { version = "=1.2.2", optional = true, features = ["derive"] }
resvg = { version = "=0.45.1", optional = true }
anyhow = { version = "1", optional = true }
async-channel = { version = "2.5", optional = true }
cpal = { version = "0.17.1", optional = true }
env_logger = { version = "0.11", optional = true }
ffmpeg-next = { version = "8.1", optional = true }
gpui = {
  path = "vendor/zed/crates/gpui",
  optional = true,
}
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit"], optional = true }
gpui_tokio = { path = "vendor/zed/crates/gpui_tokio", optional = true }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "7d0aaf55", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }

log = { version = "0.4", optional = true }
smallvec = { version = "1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
unicode-segmentation = { version = "1", optional = true }
unicode-script = { version = "0.5.8", optional = true }
ulid = { version = "3", optional = true, features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
core-foundation = { version = "0.10", optional = true }
core-video = { version = "0.5.2", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "NSEvent",
    "block2",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

[profile.dev.package."*"]
opt-level = 1

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/zed/crates/gpui" }
gpui_macros = { path = "vendor/zed/crates/gpui_macros" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform" }
