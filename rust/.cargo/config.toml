[alias]
mp3 = "run --no-default-features --features mp3 --bin mp3"
editor = "run --features editor --bin opencut-editor"
loc = "run --quiet --bin loc"
2win = "run --quiet --bin 2windows"
player = "run --no-default-features --features gstreamer-backend --bin opencut-player"


[env]
DYLD_FALLBACK_LIBRARY_PATH = "/opt/homebrew/lib"

# ffmpeg-next 8.x requires FFmpeg 8; override this environment variable on other hosts.
FFMPEG_DIR = "/opt/homebrew/opt/ffmpeg@8"
