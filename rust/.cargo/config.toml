[alias]
mp3 = "run --no-default-features --features mp3 --bin mp3"
mp4 = "run --no-default-features --features mp4 --bin mp4"
mp4-v2 = "run --no-default-features --features mp4 --bin mp4-v2"
editor = "run --no-default-features --features editor --bin opencut-editor"
loc = "run --quiet --no-default-features --bin loc"
2win = "run --quiet --no-default-features --features 2windows --bin 2windows"
player = "run --no-default-features --features player --bin opencut-player"


[env]
FFMPEG_DIR = { value = "vendor/ffmpeg-8.1.2", relative = true }
PATH={ value = "vendor/ffmpeg-8.1.2/bin", relative = true }
